         <div class="container-fluid">
    <h2>{{ msg }}</h2>
    <div class="card shadow">
        <div class="card-header py-3">
            <p class="text-primary m-0 fw-bold">&nbsp;Classes</p>
        </div>
        <div class="card-body">
            <div class="table-responsive table mt-2" id="dataTable-1" role="grid" aria-describedby="dataTable_info">
                <div class="col-lg-12 wow fadeIn" data-wow-delay="0.1s">
                    <div class="h-100 d-flex flex-column justify-content-center p-2" style="border: 5px solid #fe5d37;margin-top: 0.1px;">
                        <form method="POST" action="/tview_video" style="font-size: 0.8em;">
                            {% csrf_token %}
                            <div class="row g-3">
                                <div class="col-sm-3">
                                    <div class="form-floating">
                                        <select class="form-select" id="classname" name="Classname">
                                            <option value="">Select Class</option>
                                            <option value="prekg">PreKG</option>
                                            <option value="lkg">LKG</option>
                                            <option value="ukg">UKG</option>
                                        </select>
                                        <label for="classname">Class</label>
                                    </div>
                                </div>
                                <div class="col-sm-3">
                                    <div class="form-floating">
                                        <select class="form-select" id="subjname" name="Subjname">
                                            <option value="">Select Subject</option>
                                            <option value="english">English</option>
                                            <option value="maths">Maths</option>
                                            <option value="malayalam">Malayalam</option>
                                            <option value="art">Art & Craft</option>
                                            <option value="dance">Dance</option>
                                        </select>
                                        <label for="subjname">Subject</label>
                                    </div>
                                </div>
                                <div class="col-sm-3">
                                    <div class="form-floating">
                                        <button style="background-color:#fe5d37;" class="btn btn-primary w-100 py-2" type="submit">Search</button>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                     <div class="card-body">
                        <div class="table-responsive table mt-2" id="dataTable-2" role="grid" aria-describedby="dataTable_info">
                            <table class="table my-0" id="dataTable">
                                <thead>
                                <tr style="text-align:center;">
                                        <th >Title</th>
                                        <th>Video</th>
                                    </tr>
                                </thead>
                                <tbody>

                                      {% for x in all %}
                                       <tr style="text-align:center;">
                                           <form method="post" action="/tdel_video">
                                        {% csrf_token %}
                                               <input type="hidden" name="t_id" value={{ x.id }}>
                                               <input type="hidden" name="c_id" value={{ cls }}>
                                               <input type="hidden" name="s_id" value={{ sub }}>
                                      <td><h3 class="text-center mt-2 mb-2">{{x.title}}</h3></td>
                                      <td><video width="200" height="200"  class="embed-responsive embed-responsive-16by9" controls="controls" >
                                      <source src="{{x.video.url}}" type="video/mp4" />
                                      </video></td>
                                               <td><div class="row" style="margin-right: 0px;margin-left: 0px;width: 140px;"> <div class="col" style="width: 101px;">
                                                                                                  <button class="btn btn-danger shadow-none" type="submit" name="delete" value="Delete">Remove</button></div>
                                                                                          </div></td></form>
                                      {% endfor %}
                                </tr>
                                </tbody>

                            </table>
                        </div>
                    </div>
                </div>
        </div>
        </div>
    </div>

document.querySelector('.navbar-toggler').addEventListener('click', function() {
