<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Teacher signup</title>

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@600&family=Lobster+Two:wght@700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="static/lib/animate/animate.min.css" rel="stylesheet">
    <link href="static/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="static/css/style.css" rel="stylesheet">

</head>
<body>
<a href="/home">Home</a>
  <div class="container-xxl py-5" >
            <div class="container" >
                <div class="bg-light rounded" >
                    <div class="row g-0" >
                        <div class="col-lg-6 wow fadeIn" data-wow-delay="0.1s" >
                            <div class="h-100 d-flex flex-column justify-content-center p-5" >
                                <h1 class="mb-4" >Teacher Registration</h1>
                                <form method="POST" action="/teachersignup" onsubmit="return validateForm()">
                                    <div align="left"> <font color="black">{{msg}}</font></div>
                                    {% csrf_token %}
                                    <div class="row g-3">
                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control border-0" id="name" placeholder="Name" name="Name">
                                                <label for="name">Name</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <input type="number" class="form-control border-0" id="age" placeholder="Age" name="Age">
                                                <label for="age">Age</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-floating">

                                               <select class="form-control border-0" id="gender" style="background: #FFFFFF;" name="Gender">
                                                    <option value="">Select Gender</option>
                                                    <option value="male">Male</option>
                                                    <option value="female">Female</option>
                                                    <option value="other">Other</option>
                                                </select>
                                                <label for="gender">Gender</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <select class="form-control border-0" id="subject" style="background: #FFFFFF;" name="Subject">
                                                    <option value="">Select your subject</option>
                                                    <option value="eng">English</option>
                                                    <option value="mal">Malayalam</option>
                                                    <option value="mat">Maths</option>
                                                    <option value="art">Art&Craft</option>
                                                    <option value="dance">Dance</option>
                                                </select>
                                                <label for="subject">Subject</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="text" class="form-control border-0" id="contactno" placeholder="Contact No" name="Contactno">
                                                <label for="contactno">Contact No</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="email" class="form-control border-0" id="emailid" placeholder="Email ID" name="Email">
                                                <label for="emailid">Email ID</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="password" class="form-control border-0" id="password" placeholder="Password" name="Password">
                                                <label for="password">Password</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <button class="btn btn-primary w-100 py-3" type="submit">Register</button>
                                        </div>
                                        <div>
                                        If you already have an account <a href="\tloginf">Login</a>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
<script>
    function validateForm() {
        // Get the input values
        var name = document.getElementById("name").value.trim();
        var age = document.getElementById("age").value.trim();
        var gender = document.getElementById("gender").value;
        var subject = document.getElementById("subject").value;
        var contactNo = document.getElementById("contactno").value.trim();
        var emailId = document.getElementById("emailid").value.trim();
        var password = document.getElementById("password").value;

        // Check if the inputs are empty
        if (name === "" || age === "" || gender === "" || subject === "" || contactNo === "" || emailId === "" || password === "") {
            alert("Please fill out all fields.");
            return false;
        }

        // Check if the name contains only letters and spaces
        if (!/^[a-zA-Z\s\.]*$/.test(name)) {
            alert("Name must contain only letters, spaces and periods.");
            return false;
        }

        // Check if the age is a valid number
        if (isNaN(age) || age <= 0) {
            alert("Please enter a valid age.");
            return false;
        }

        // Check if the contact number is a valid number
        if (isNaN(contactNo) || contactNo <= 0 ) {
            alert("Please enter a valid contact number.");
            return false;
        }

        // Check if the email id is valid
        var emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if (!emailId.match(emailPattern)) {
            alert("Please enter a valid email id.");
            return false;
        }
        if (!/^\d{10}$/.test(contactNo)) {
            alert("Please enter a valid 10-digit contact number.");
            return false;
        }

        // Check if the password is empty
        if (password === "") {
            alert("Please enter a password.");
            return false;
        }

        return true;
    }
</script>
</body>
</html>
