            <div class="col-md-6 grid-margin stretch-card">
              <div class="card ">
                <div class="card-body justify-content-center align-items-center">
                <h2>&nbsp{{ msg }}</h2> <br/>
                    <div class="h-100 d-flex flex-column justify-content-center p-5" style="border: 5px solid #fe5d37;">
                  <h4 class="card-title"><center>Feedback</center></h4>

                  <form class="forms-sample" method="post" action="/psent_feedback1" onsubmit="return validateForm()">
                    {% csrf_token %}
                    <div class="form-group">
                        <label for="uname">Parent Name</label>
                        <input type="text" class="form-control" id="pname" name="pname" value="{{name}}" readonly>
                      </div>
                    <div class="form-group">
                      <label for="uname">Feedback</label>
                      <textarea name="feedback" placeholder="Feedback" class="form-control"></textarea>
                    </div>
                   
                   
                    <div class="form-group">
                      <label for="contactnum">Date</label>
                      <input type="date" class="form-control" id="mydate" placeholder="Date" name="mydate">
                    </div>
                    
                    <button type="submit" style="background-color:#fe5d37;" class="btn btn-primary w-100 py-3">Submit</button>
                  </form>
                </div>

              </div>
            </div>
            <script>
              $(function(){
                 
                  var today = new Date().toISOString().split('T')[0];
                var nextWeekDate = new Date(new Date().getTime() + 0 * 24 * 60 * 60 * 1000).toISOString().split('T')[0]
                document.getElementsByName("mydate")[0].setAttribute('min', today);
                document.getElementsByName("mydate")[0].setAttribute('max', nextWeekDate)
              });
    function validateForm() {
        // Get the input values
        var pname = document.getElementById("pname").value.trim();
        var feedback = document.getElementsByName("feedback")[0].value.trim();
        var mydate = document.getElementById("mydate").value;

        // Check if the inputs are empty
        if (pname === "" || feedback === "" || mydate === "") {
            alert("Please fill out all fields.");
            return false;
        }

        return true;
    }
</script>
