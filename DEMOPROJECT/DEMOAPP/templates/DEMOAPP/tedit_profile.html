          <div class="col-md-6 grid-margin stretch-card">
    <div class="card">
        <div class="card-body d-flex justify-content-center align-items-center">
            <h2>&nbsp{{ msg }}</h2> <br/>
            <div class="h-100 d-flex flex-column justify-content-center p-5" style="border: 5px solid #fe5d37;">
                <h4 class="card-title text-center">Edit Profile</h4>
                 {% for x in records %}
                <form method="POST" action="/tedit_profile1" class="w-100" onsubmit="return validateForm()">
                                    {% csrf_token %}
                                    <div class="row g-3">
                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control border-0" id="name" value="{{x.1}}" placeholder="Name" name="Name">
                                                <label for="name">Name</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <input type="number" class="form-control border-0" id="age" value="{{x.2}}" placeholder="Age" name="Age">
                                                <label for="age">Age</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-floating">

                                               <select class="form-control border-0" id="gender" style="background: #FFFFFF;" name="Gender">
                                                    <option value="">Select Gender</option>
                                                    <option value="male" {% if x.3 == "male" %}selected{% endif %}>Male</option>
                                                    <option value="female"{% if x.3 == "female" %}selected{% endif %}>Female</option>
                                                    <option value="other"{% if x.3 == "other" %}selected{% endif %}>Other</option>
                                                </select>
                                                <label for="gender">Gender</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <select class="form-control border-0" id="subject" style="background: #FFFFFF;" name="Subject">
                                                    <option value="">Select your subject</option>
                                                    <option value="eng"{% if x.4 == "eng" %}selected{% endif %}>English</option>
                                                    <option value="mal"{% if x.4 == "mal" %}selected{% endif %}>Malayalam</option>
                                                    <option value="mat"{% if x.4 == "mat" %}selected{% endif %}>Maths</option>
                                                    <option value="art"{% if x.4 == "art" %}selected{% endif %}>Art&Craft</option>
                                                    <option value="dance"{% if x.4 == "dance" %}selected{% endif %}>Dance</option>
                                                </select>
                                                <label for="subject">Subject</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="text" class="form-control border-0" id="contactno" placeholder="Contact No" value="{{x.5}}" name="Contactno">
                                                <label for="contactno">Contact No</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="email" class="form-control border-0" id="emailid" value={{x.6}} placeholder="Email ID" name="Email">
                                                <label for="emailid">Email ID</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="password" class="form-control border-0" id="password" value={{x.7}} placeholder="Password" name="Password">
                                                <label for="password">Password</label>
                                            </div>
                                        </div>
                                                                                <div class="col-12">
                                             <button type="submit" style="background-color:#fe5d37;" class="btn btn-primary w-100 py-3">Submit</button>
                                        </div>
                                    </div>
                                </form>
                {% endfor %}

   <script>
document.querySelector('.navbar-toggler').addEventListener('click', function() {
    var title = document.querySelector('.navbar-brand');
    if (title.style.display === 'none') {
        title.style.display = 'block';
    } else {
        title.style.display = 'none';
    }
});
    function validateForm() {
        // Get the input values
        var name = document.getElementById("name").value.trim();
        var age = document.getElementById("age").value.trim();
        var gender = document.getElementById("gender").value;
        var subject = document.getElementById("subject").value;
        var contactNo = document.getElementById("contactno").value.trim();
        var emailId = document.getElementById("emailid").value.trim();
        var password = document.getElementById("password").value;

        // Check if the inputs are empty
        if (name === "" || age === "" || gender === "" || subject === "" || contactNo === "" || emailId === "" || password === "") {
            alert("Please fill out all fields.");
            return false;
        }

        // Check if the name contains only letters, spaces, and periods
        if (!/^[a-zA-Z\s\.]*$/.test(name)) {
            alert("Name must contain only letters, spaces, and periods.");
            return false;
        }

        // Check if the age is a valid number
        if (isNaN(age) || age <= 0) {
            alert("Please enter a valid age.");
            return false;
        }

        // Check if the contact number is a valid number
        if (isNaN(contactNo) || contactNo <= 0) {
            alert("Please enter a valid contact number.");
            return false;
        }
        if (!/^\d{10}$/.test(contactNo)) {
            alert("Please enter a valid 10-digit contact number.");
            return false;
        }
        // Check if the email id is valid
        var emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
        if (!emailId.match(emailPattern)) {
            alert("Please enter a valid email id.");
            return false;
        }

        // Check if the password is empty
        if (password === "") {
            alert("Please enter a password.");
            return false;
        }

        return true;
    }
</script>
