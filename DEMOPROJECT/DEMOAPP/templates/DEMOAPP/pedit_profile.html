     <div class="col-md-6 grid-margin stretch-card">
    <div class="card">
        <div class="card-body d-flex justify-content-center align-items-center">
            <h2>&nbsp{{ msg }}</h2> <br/>
            <div class="h-100 d-flex flex-column justify-content-center p-5" style="border: 5px solid #fe5d37;">
                <h4 class="card-title text-center">Edit Profile</h4>
                 {% for x in records %}
                <form method="POST" action="/pedit_profile1" class="w-100" onsubmit="return validateForm()">
                                    {% csrf_token %}
                                    <div class="row g-3">
                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control border-0" id="name"  value="{{x.1}}" name="Name">
                                                <label for="name">Name</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control border-0" id="childname" placeholder="Child name" value="{{x.2}}" name="Childname">
                                                <label for="childname">Child name</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <input type="text" class="form-control border-0" id="childage" placeholder="Child age" value="{{x.3}}" name="Childage">
                                                <label for="childage">Child age</label>
                                            </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="form-floating">
                                                <input type="date" class="form-control border-0" id="childdob" placeholder="Child DOB" value="{{x.4}}" name="Childdob">
                                                <label for="childdob">Child DOB</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">

                                               <select class="form-control border-0" id="childclass" style="background: #FFFFFF;" value="{{x.5}}" name="Childclass">
                                                    <option value="">Select Class</option>
                                                    <option value="PreKG" {% if x.5 == "PreKG" %}selected{% endif %}>PreKG</option>
                                                    <option value="LKG" {% if x.5 == "LKG" %}selected{% endif %}>LKG</option>
                                                    <option value="UKG" {% if x.5 == "UKG" %}selected{% endif %}>UKG</option>
                                                </select>
                                                <label for="childclass">Child class</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="text" class="form-control border-0" id="contactno" value="{{x.6}}" placeholder="Contact No" name="Contactno">
                                                <label for="contactno">Contact No</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="email" class="form-control border-0" id="emailid" value="{{x.7}}" placeholder="Email ID" name="Email">
                                                <label for="emailid">Email ID</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating">
                                                <input type="password" class="form-control border-0" id="password" value="{{x.8}}" placeholder="Password" name="Password">
                                                <label for="password">Password</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                             <button type="submit" style="background-color:#fe5d37;" class="btn btn-primary w-100 py-3">Submit</button>
                                        </div>
                                    </div>

                                </form>
                {% endfor %}

    <script>
document.querySelector('.navbar-toggler').addEventListener('click', function() {
    var title = document.querySelector('.navbar-brand');
    if (title.style.display === 'none') {
        title.style.display = 'block';
    } else {
        title.style.display = 'none';
    }
});
function validateForm() {
    // Get the input values
    var name = document.getElementById("name").value.trim();
    var childName = document.getElementById("childname").value.trim();
    var childAge = document.getElementById("childage").value.trim();
    var childDob = document.getElementById("childdob").value;
    var childClass = document.getElementById("childclass").value;
    var contactNo = document.getElementById("contactno").value.trim();
    var emailId = document.getElementById("emailid").value.trim();
    var password = document.getElementById("password").value;

    // Check if the inputs are empty
    if (name === "" || childName === "" || childAge === "" || childDob === "" || childClass === "" || contactNo === "" || emailId === "" || password === "") {
        alert("Please fill out all fields.");
        return false;
    }

    // Check if the name and child's name contain only letters and spaces
    if (!/^[a-zA-Z\s\.]*$/.test(name)) || !/^[a-zA-Z\s\.]*$/.test(childName)) {
        alert("Name and Child's name must contain only letters, spaces and periods.");
        return false;
    }

    // Check if the child's age is a valid number
    if (isNaN(childAge) || childAge <= 0) {
        alert("Please enter a valid age for the child.");
        return false;
    }

    // Check if the contact number is a valid number
    if (isNaN(contactNo) || contactNo <= 0) {
        alert("Please enter a valid contact number.");
        return false;
    }
    if (!/^\d{10}$/.test(contactNo)) {
        alert("Please enter a valid 10-digit contact number.");
        return false;
    }
    // Check if the email id is valid
    var emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
    if (!emailId.match(emailPattern)) {
        alert("Please enter a valid email id.");
        return false;
    }

    // Check if the password is empty
    if (password === "") {
        alert("Please enter a password.");
        return false;
    }

    return true;
};
</script>
