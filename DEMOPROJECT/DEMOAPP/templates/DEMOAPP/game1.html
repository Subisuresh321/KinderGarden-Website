<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Matching The Letters</title>

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@600&family=Lobster+Two:wght@700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="static/lib/animate/animate.min.css" rel="stylesheet">
    <link href="static/lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="static/css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="static/css/style.css" rel="stylesheet">


<style>

iframe {
    display: block;
    margin-left: auto;
    margin-right: auto;
    border: 5px solid #fe5d37;
}
</style>
</head>
<body>
    {% load static %}
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
            <iframe src="{% static 'games/game1/web/index.html' %}" width="800" height="600"></iframe>
            <a href="/home" class="nav-item nav-link active">Home</a>
        </div>
<script>
window.onerror = function() {
    // Custom alert message
    var message = "Game not fully loaded. Please reload the page.";

    // Create a new div element for the custom alert box
    var alertBox = document.createElement("div");
    alertBox.style.position = "fixed";
    alertBox.style.left = "0";
    alertBox.style.top = "0";
    alertBox.style.width = "100%";
    alertBox.style.height = "100%";
    alertBox.style.backgroundColor = "rgba(0,0,0,0.5)";
    alertBox.style.color = "white";
    alertBox.style.display = "flex";
    alertBox.style.justifyContent = "center";
    alertBox.style.alignItems = "center";
    alertBox.style.flexDirection = "column";
    alertBox.style.zIndex = "1000";

    // Add the message to the alert box
    var msg = document.createElement("p");
    msg.textContent = message;
    alertBox.appendChild(msg);

    // Create a reload button
    var button = document.createElement("button");
    button.textContent = "Reload";
    button.style.marginTop = "20px";
    button.onclick = function() {
        location.reload();
    };

    // Add the button to the alert box
    alertBox.appendChild(button);

    // Add the alert box to the body of the document
    document.body.appendChild(alertBox);
};
</script>
</body>
</html>
